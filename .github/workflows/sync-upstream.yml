name: Sync Upstream Nightly

on:
  schedule:
    # 每 2 小时检查一次，可根据需求调整
    - cron: '0 */2 * * *'
  workflow_dispatch:   # 允许手动触发，方便调试

env:
  UPSTREAM_REPO: 'Kiwi233/Translation-of-GTNH'   # 上游仓库
  TARGET_BRANCH: 'upstream-nightly'              # 你要创建/更新的分支名
  LAST_TAG_FILE: 'last_synced_tag.txt'           # 记录上次同步的 tag

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # 你自己的 token，需有写权限

      - name: Get latest release tag from upstream
        id: get_tag
        run: |
          # 调用 GitHub API 获取最新 Release（按照 published_at 排序）
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/${{ env.UPSTREAM_REPO }}/releases/latest)
          # 提取 tag_name
          TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          # 若没有 Release，可改用 tags 接口：/tags?per_page=1
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $TAG"

      - name: Read last synced tag
        id: read_last
        run: |
          if [ -f "${{ env.LAST_TAG_FILE }}" ]; then
            LAST_TAG=$(cat ${{ env.LAST_TAG_FILE }})
            echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          else
            echo "last_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Compare tags and sync if new
        if: steps.get_tag.outputs.tag != steps.read_last.outputs.last_tag
        run: |
          echo "New tag detected: ${{ steps.get_tag.outputs.tag }} (previous: ${{ steps.read_last.outputs.last_tag }})"
          # 设置后续步骤需要的环境变量
          echo "NEW_TAG=${{ steps.get_tag.outputs.tag }}" >> $GITHUB_ENV

      - name: Checkout upstream repo at the new tag
        if: env.NEW_TAG != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.NEW_TAG }}
          path: upstream_repo   # 检出到子目录

      - name: Create/update your branch with upstream content
        if: env.NEW_TAG != ''
        run: |
          # 切换到目标分支（没有则创建）
          git checkout -B ${{ env.TARGET_BRANCH }}
          
          # 删除当前目录所有文件和隐藏文件，但保留 .git
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} \;
          
          # 复制 upstream_repo 所有内容到当前目录
          cp -r upstream_repo/* . 2>/dev/null || true
          cp -r upstream_repo/.[!.]* . 2>/dev/null || true
          
          # 配置 git 用户
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 添加所有变更并提交
          git add -A
          git commit -m "Sync upstream tag ${{ env.NEW_TAG }}" || echo "No changes to commit"
          
          # 强制推送
          git push origin ${{ env.TARGET_BRANCH }} --force

      - name: Update last synced tag
        if: env.NEW_TAG != ''
        run: |
          echo "${{ env.NEW_TAG }}" > ${{ env.LAST_TAG_FILE }}
          git add ${{ env.LAST_TAG_FILE }}
          git commit -m "Update last synced tag to ${{ env.NEW_TAG }}" || true
          git push origin HEAD   # 推送到默认分支（如 main）
